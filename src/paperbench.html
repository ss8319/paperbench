<title>Paperbench PDF Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky toolbar over a two-column workbench — page desk on the left, export panel on the right; stacks on phones. */
:root{
  --bg:#e8eaee; --panel:#ffffff; --desk:#dde0e6; --ink:#15171c; --muted:#5b6270; --line:#d1d5dc;
  --accent:#2a44c9; --accent-ink:#ffffff; --accent-soft:#e2e6fb; --danger:#c2362b; --ok:#1d7a4a;
  --shadow:0 1px 2px rgba(20,24,35,.08),0 4px 14px rgba(20,24,35,.08);
  --f-ui:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111317; --panel:#1a1d22; --desk:#0c0e11; --ink:#e6e8ec; --muted:#9aa1ad; --line:#2c3139;
  --accent:#8597ff; --accent-ink:#0c1022; --accent-soft:#222a4c; --danger:#ff7b6f; --ok:#5fd394;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111317; --panel:#1a1d22; --desk:#0c0e11; --ink:#e6e8ec; --muted:#9aa1ad; --line:#2c3139;
  --accent:#8597ff; --accent-ink:#0c1022; --accent-soft:#222a4c; --danger:#ff7b6f; --ok:#5fd394;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;margin-right:auto}
.brand small{font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.mark{width:22px;height:26px;position:relative}
.mark i{position:absolute;inset:0;border:1.5px solid var(--ink);border-radius:2px;background:var(--panel)}
.mark i:first-child{transform:translate(4px,-3px);opacity:.45}
.mark i:last-child::after{content:"";position:absolute;right:-1.5px;top:-1.5px;width:7px;height:7px;background:var(--accent);clip-path:polygon(0 0,100% 100%,100% 0)}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg,.ico svg{width:16px;height:16px;flex:none}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:0;min-height:calc(100vh - 60px)}
.work{min-width:0;background:var(--desk);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;padding-block:16px 40px}
.side{background:var(--panel);border-left:1px solid var(--line);padding:18px 16px 40px;padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
@media (max-width:820px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px))}.work{padding-right:max(16px,env(safe-area-inset-right,0px))}}

.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;width:max-content;max-width:100%}
.tab{border:0;background:none;padding:6px 14px;border-radius:7px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--ink)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}

.banner{background:var(--accent-soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner p{margin:0;flex:1 1 260px}

.selbar{font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);padding:2px 4px;font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 16px;align-items:start}
@media (max-width:420px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}}
.card{display:flex;flex-direction:column;gap:6px;position:relative;border-radius:8px;padding:6px;border:2px solid transparent;min-width:0}
.card.is-sel{border-color:var(--accent);background:var(--accent-soft)}
.card.dragging{opacity:.35}
.card.drop-before::before,.card.drop-after::after{content:"";position:absolute;top:6px;bottom:6px;width:3px;background:var(--accent);border-radius:2px}
.card.drop-before::before{left:-11px}.card.drop-after::after{right:-11px}
.paper{display:block;background:#fff;box-shadow:var(--shadow);border-radius:2px;line-height:0;border:0;padding:0;cursor:zoom-in;overflow:hidden}
.paper canvas{width:100%;height:auto;display:block}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);min-width:0}
.meta input{margin:0;accent-color:var(--accent)}
.meta .no{font-family:var(--f-mono);color:var(--ink);font-weight:500}
.meta .from{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.acts{display:flex;gap:2px;justify-content:space-between}
.ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid transparent;background:none;color:var(--muted);padding:0}
.ico:hover{background:var(--panel);border-color:var(--line);color:var(--ink)}
.ico.del:hover{color:var(--danger)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:40px 20px;text-align:center;color:var(--muted);background:var(--panel)}
body.filedrag .work{outline:3px dashed var(--accent);outline-offset:-10px}

.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;margin-bottom:12px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1px solid transparent;background:none;border-radius:7px;padding:6px 10px;font-weight:500;color:var(--ink)}
.tool:hover{background:var(--bg)}
.tool[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.sw{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--accent)}
.num{width:58px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.lbl{font-size:12px;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px;min-height:1.4em}
.stage{display:flex;justify-content:center;overflow:auto;padding:4px 0 16px}
.canvwrap{position:relative;box-shadow:var(--shadow);background:#fff;line-height:0;flex:none}
.canvwrap canvas{display:block}
#ov{position:absolute;inset:0;touch-action:none}
#ov.t-select{cursor:default;touch-action:pan-y}
#ov.t-text{cursor:text}#ov.t-draw,#ov.t-hl,#ov.t-wo,#ov.t-place{cursor:crosshair}
#txt{position:absolute;margin:0;padding:0;border:1px dashed var(--accent);background:rgba(255,255,255,.85);outline:none;resize:none;overflow:hidden;line-height:1.2;font-family:Helvetica,Arial,sans-serif;min-width:3ch;white-space:pre;z-index:3}
.nav{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}

.side h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px;font-weight:600}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label,.field .lab{font-weight:600;font-size:13px}
.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.radios{display:flex;gap:14px;flex-wrap:wrap}
.radios label{font-weight:400;display:flex;gap:6px;align-items:center}
.radios input{accent-color:var(--accent)}
.desc{font-size:12.5px;color:var(--muted);margin:0}
.result{font-size:13px;border-radius:8px;padding:10px 12px;background:var(--bg);border:1px solid var(--line)}
.result b{font-weight:600}
.result.ok{border-color:var(--ok)}
.result.err{border-color:var(--danger);color:var(--danger)}
.files{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.files li{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.files .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.files .sz{color:var(--muted);font-size:12px}
.note{font-size:12px;color:var(--muted);display:flex;gap:7px;align-items:flex-start}
.note svg{width:14px;height:14px;flex:none;margin-top:2px}

.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,18,.5);display:grid;place-items:center;padding:16px}
.dialog{background:var(--panel);border-radius:12px;padding:18px;width:min(560px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.dialog h3{margin:0;font-size:16px}
#sigpad{width:100%;height:180px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

<header class="bar">
  <div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i></span>Paperbench <small>PDF editor</small></div>
  <button class="btn" id="undoBtn" title="Undo (Ctrl/⌘+Z)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>Undo</button>
  <label class="btn primary" for="fileIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>Open PDFs</label>
  <input type="file" id="fileIn" accept="application/pdf,.pdf" multiple class="vh">
</header>

<main class="layout">
  <section class="work">
    <div class="toprow">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" id="tabPages" aria-selected="true">Pages</button>
        <button class="tab" role="tab" id="tabEdit" aria-selected="false">Edit page</button>
      </div>
      <div class="selbar" id="selbar"></div>
    </div>
    <div class="banner" id="banner" hidden>
      <p>You're looking at an example file. Open your own PDFs or drop them anywhere on this page. Nothing is uploaded: every step runs on your device.</p>
      <label class="btn primary" for="fileIn">Open PDFs</label>
    </div>

    <div id="pagesView">
      <div class="grid" id="grid"></div>
    </div>

    <div id="editView" hidden>
      <div class="tools" id="tools">
        <button class="tool" data-tool="select" aria-pressed="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m5 3 14 8-6 2-3 6z"/></svg>Select</button>
        <button class="tool" data-tool="text"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg>Text</button>
        <button class="tool" data-tool="draw"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c3-6 5 2 8-3s5-6 7-3 2 6 3 5"/></svg>Draw</button>
        <button class="tool" data-tool="hl"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="m14 4 6 6-9 9H5v-6z"/><path d="M3 21h18"/></svg>Highlight</button>
        <button class="tool" data-tool="wo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="7" width="16" height="10" rx="1"/></svg>Whiteout</button>
        <button class="tool" data-tool="sig"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18c2-1 3-9 5-9s0 9 2 9 3-5 5-5 1 4 3 4 3-2 3-2"/><path d="M3 21h18"/></svg>Sign</button>
        <button class="tool" data-tool="image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 16 5-5 5 5 3-3 5 5"/></svg>Image</button>
        <span class="sep"></span>
        <span class="row" id="swatches" aria-label="Colour"></span>
        <span class="sep"></span>
        <span class="row" style="gap:6px"><label class="lbl" for="sizeIn">Text size</label><input class="num mono" id="sizeIn" type="number" min="5" max="96" value="12"></span>
        <span class="row" style="gap:6px"><label class="lbl" for="strokeIn">Pen</label><input class="num mono" id="strokeIn" type="number" min="0.5" max="20" step="0.5" value="1.5"></span>
        <span class="sep"></span>
        <button class="ico" id="smaller" title="Make selected smaller" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
        <button class="ico" id="bigger" title="Make selected bigger" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="ico del" id="delAnnot" title="Delete selected (Del)" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
      <p class="hint" id="hint"></p>
      <div class="stage" id="stage">
        <div class="canvwrap" id="canvwrap">
          <canvas id="base"></canvas><canvas id="ov" class="t-select"></canvas>
          <textarea id="txt" hidden rows="1" spellcheck="false" aria-label="Text"></textarea>
        </div>
      </div>
      <div class="nav">
        <button class="btn" id="prevPg">← Prev</button>
        <span class="mono" id="pgLabel"></span>
        <button class="btn" id="nextPg">Next →</button>
        <button class="ico" id="edRotL" title="Rotate left"></button>
        <button class="ico" id="edRotR" title="Rotate right"></button>
      </div>
    </div>
  </section>

  <aside class="side">
    <section>
      <h2>Save PDF</h2>
      <div class="field"><label for="outName">File name</label><input class="inp" id="outName" value="document.pdf"></div>
      <div class="field"><span class="lab">Pages</span>
        <div class="radios"><label><input type="radio" name="scope" value="all" checked>All pages</label><label><input type="radio" name="scope" value="sel" id="scopeSel">Selected only</label></div>
      </div>
      <div class="field"><label for="comp">Compression</label>
        <select class="inp" id="comp">
          <option value="none">None</option>
          <option value="light">Light: recompress images, keep text</option>
          <option value="med">Balanced: recompress images, keep text</option>
          <option value="strong">Strong: recompress images, keep text</option>
          <option value="flat">Maximum: flatten pages to images</option>
        </select>
        <p class="desc" id="compDesc"></p>
      </div>
      <button class="btn primary" id="saveBtn" style="width:100%;justify-content:center">Save PDF</button>
      <div class="result" id="result" hidden style="margin-top:12px"></div>
    </section>
    <section>
      <h2>Open files</h2>
      <ul class="files" id="files"></ul>
    </section>
    <p class="note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>Files stay on this device. Nothing is uploaded to a server.</p>
  </aside>
</main>

<div class="modal" id="sigModal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="sigTitle">
    <h3 id="sigTitle">Draw your signature</h3>
    <canvas id="sigpad"></canvas>
    <div class="row" style="justify-content:space-between">
      <button class="btn" id="sigClear">Clear</button>
      <span class="row"><button class="btn" id="sigCancel">Cancel</button><button class="btn primary" id="sigUse">Place on page</button></span>
    </div>
  </div>
</div>
<input type="file" id="imgIn" accept="image/png,image/jpeg" class="vh">
<div class="toast" id="toast" hidden role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script>
(() => {
const L = window.PDFLib;
const { PDFDocument, StandardFonts, rgb, degrees, BlendMode, LineCapStyle, PDFName, PDFRawStream, PDFArray, PDFRef, PDFNumber } = L;
const inlineWorker = document.getElementById("pdfjs-worker-src");
pdfjsLib.GlobalWorkerOptions.workerSrc = inlineWorker ? URL.createObjectURL(new Blob([inlineWorker.textContent], { type: "text/javascript" })) : "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = s => document.querySelector(s);
const DPR = () => Math.min(window.devicePixelRatio || 1, 2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => n < 1024 ? n + " B" : n < 1048576 ? Math.round(n/1024) + " KB" : (n/1048576).toFixed(n < 10485760 ? 2 : 1) + " MB";
const norm = r => ((r % 360) + 360) % 360;
const hexRgb = h => { const n = parseInt(h.slice(1), 16); return [(n>>16&255)/255, (n>>8&255)/255, (n&255)/255]; };
function toast(m){ const t=$("#toast"); t.textContent=m; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,3400); }

const ICON = {
  rotl:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v6h6"/><path d="M3.5 10A9 9 0 1 1 6 17"/></svg>',
  rotr:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v6h-6"/><path d="M20.5 10A9 9 0 1 0 18 17"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'
};
$("#edRotL").innerHTML = ICON.rotl; $("#edRotR").innerHTML = ICON.rotr;

const COLORS = ["#16181d", "#1f3fbf", "#c42b20", "#13804a"];
const S = { sources: [], pages: [], view: "pages", cur: 0, tool: "select", color: COLORS[0], size: 12, stroke: 1.5, sel: -1, pending: null, sample: false };
let uid = 1;
const hist = [];
function snapshot(){ hist.push(JSON.stringify(S.pages)); if (hist.length > 80) hist.shift(); $("#undoBtn").disabled = false; }
function undo(){
  if (!hist.length) return;
  S.pages = JSON.parse(hist.pop()); S.sel = -1;
  $("#undoBtn").disabled = !hist.length;
  if (S.cur >= S.pages.length) S.cur = Math.max(0, S.pages.length - 1);
  refresh();
}

/* ---------- loading ---------- */
async function addSource(name, bytes){
  let doc;
  try { doc = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise; }
  catch (e) { throw new Error(e && e.name === "PasswordException" ? "it is password-protected" : "it doesn't look like a valid PDF"); }

      const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, nw, nh);

      if (nb.length < raw.length * 0.92) {

        d.set(N("Width"), PDFNumber.of(nw)); d.set(N("Height"), PDFNumber.of(nh));

}
async function flatten(bytes, pr, onStep){
  const src = await pdfjsLib.getDocument({ data: bytes.slice(), isEvalSupported: false }).promise;
  const out = await PDFDocument.create();
  for (let i = 1; i <= src.numPages; i++) {
    onStep && onStep(i, src.numPages);
    const pg = await src.getPage(i);
    const v1 = pg.getViewport({ scale: 1 });
    const sc = Math.min(pr.dpi / 72, 5000 / Math.max(v1.width, v1.height));
    const vp = pg.getViewport({ scale: sc });
    const c = document.createElement("canvas"); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    const cx = c.getContext("2d"); cx.fillStyle = "#fff"; cx.fillRect(0, 0, c.width, c.height);
    await pg.render({ canvasContext: cx, viewport: vp }).promise;
    const jpg = await out.embedJpg(new Uint8Array(await (await toBlob(c, pr.q)).arrayBuffer()));
    out.addPage([v1.width, v1.height]).drawImage(jpg, { x: 0, y: 0, width: v1.width, height: v1.height });
    pg.cleanup();
  }
  out.setProducer("Paperbench");
  return out.save();
}
async function saveFile(name, bytes){
  const blob = new Blob([bytes], { type: "application/pdf" });
  if (window.claude && typeof window.claude.use === "function") {
    const dl = await window.claude.use("downloads");
    if (!dl) throw new Error("Saving files isn't available in this view. Open the artifact in claude.ai, or use the downloaded copy of this app.");
    try { await dl.save({ filename: name, data: blob }); return true; }
    catch (e) {
      if (e && e.code === "declined") return false;
      if (e && e.code === "rate_limited") throw new Error("A save prompt is already open. Finish that one first.");
      throw new Error((e && e.message) || "The file couldn't be saved.");
    }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return true;
}
$("#saveBtn").onclick = async () => {
  commitText();
  const scope = document.querySelector("input[name=scope]:checked").value;
  const list = scope === "sel" ? S.pages.filter(p => p.sel) : S.pages;
  const res = $("#result"), btn = $("#saveBtn");
  if (!list.length) { res.hidden = false; res.className = "result err"; res.textContent = scope === "sel" ? "Select at least one page first." : "Open a PDF first."; return; }
  let name = ($("#outName").value.trim() || "document.pdf").replace(/[\\/:*?"<>|]+/g, "-");
  if (!/\.pdf$/i.test(name)) name += ".pdf";
  btn.disabled = true; res.hidden = false; res.className = "result";
  const step = (msg) => res.innerHTML = `<span class="spin"></span> ${msg}`;
  try {
    step("Building PDF…");
    const built = await buildEdited(list);
    let bytes = built, kept = false, stats = null;
    const mode = compSel.value, pr = PRESETS[mode];
    if (mode === "light" || mode === "med" || mode === "strong") { bytes = await smartCompress(built, pr, (i, n) => step(`Compressing images ${i}/${n}…`)); stats = bytes.stats; }
    if (mode === "flat") bytes = await flatten(built, pr, (i, n) => step(`Flattening page ${i}/${n}…`));
    if (mode !== "none" && bytes.length >= built.length) { bytes = built; kept = true; }
    const orig = [...new Set(list.map(p => p.src))].reduce((t, si) => t + S.sources[si].size, 0);
    step("Waiting for you to confirm the save…");
    const ok = await saveFile(name, bytes);
    const pct = Math.round((1 - bytes.length / orig) * 100);
    const sizeLine = `<span class="mono">${fmt(orig)} → ${fmt(bytes.length)}</span>${pct > 0 ? ` <b>(${pct}% smaller)</b>` : pct < 0 ? ` (${-pct}% larger)` : ""}`;
    res.className = ok ? "result ok" : "result";
    res.innerHTML = (ok ? `<b>Saved ${esc(name)}</b>` : "Save cancelled.") + `<br>${list.length} page${list.length > 1 ? "s" : ""} · ${sizeLine}` +
      (kept ? `<br><span class="desc">${mode === "flat" ? "Flattening would have made this file bigger, so the pages were kept as they are." : "This setting couldn't shrink the file any further, so nothing was changed."}</span>`
        : stats && stats.images === 0 ? `<br><span class="desc">This PDF has no images to shrink. Its size comes from text and fonts.</span>`
        : mode !== "none" && pct < 5 ? `<br><span class="desc">Little to compress here. Try a stronger setting, or Maximum for scans.</span>` : "");
  } catch (e) {
    console.error(e); res.className = "result err"; res.textContent = e.message || "Something went wrong while building the PDF.";
  } finally { btn.disabled = false; }
};
